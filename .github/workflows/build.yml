name: Build and Release

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run regression tests
        run: dotnet test tests/HideEmptyFolders.Tests/HideEmptyFolders.Tests.csproj --configuration Release

      - name: Create plugin ZIP
        run: |
          mkdir -p publish
          cp bin/Release/net10.0/Jellyfin.Plugin.HideEmptyFolders.dll publish/
          cp thumb.png publish/
          cp meta.json publish/
          PLUGIN_VERSION=$(jq -r '.version' meta.json)
          PACKAGE_NAME="Jellyfin.Plugin.HideEmptyFolders-${PLUGIN_VERSION}.zip"
          cd publish
          zip -X "../${PACKAGE_NAME}" Jellyfin.Plugin.HideEmptyFolders.dll thumb.png meta.json
          CHECKSUM=$(md5sum "../${PACKAGE_NAME}" | cut -d' ' -f1)
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"
          echo "CHECKSUM=${CHECKSUM}" >> "$GITHUB_ENV"
          echo "Created ${PACKAGE_NAME} (MD5: ${CHECKSUM})"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.HideEmptyFolders
          path: publish/

      - name: Upload release asset (tagged pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PACKAGE_NAME }}
          generate_release_notes: true
